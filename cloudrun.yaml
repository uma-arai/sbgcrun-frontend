apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sbgcrun-frontend
  annotations:
    #   run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
    run.googleapis.com/maxScale: "2"
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    # 6-1でコメントを外す。デフォルトURLを無効化する
    run.googleapis.com/default-url-disabled: "true"
#    run.googleapis.com/binary-authorization: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/execution-environment: gen2
        # TODO: 配布時はPROJECT_IDをプレースホルダーにする
        run.googleapis.com/network-interfaces: '[{"network":"sbgcrun-app", "subnetwork":"sbgcrun-app"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      # TODO: 配布時はPROJECT_IDをプレースホルダーにする
      serviceAccountName: sbgcrun-app-frontend@core-port-495407-g3.iam.gserviceaccount.com
      containers:
      - image: frontend
        env:
          - name: BACKEND_URL
            value: "https://sbgcrun-backend-992104480811.asia-east1.run.app" # FIXME: Change BACKEND_FQDN value after backend resources is created
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 2
          failureThreshold: 60
          tcpSocket:
            port: 8080