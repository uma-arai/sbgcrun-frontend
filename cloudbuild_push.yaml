options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
  env:
    - "DEPLOY_ENV=$_DEPLOY_ENV"
    - "SKAFFOLD_DEFAULT_REPO=asia-northeast1-docker.pkg.dev/$PROJECT_ID/sbgcrun-app"

steps:
  # buildx + registry cache でビルド。skaffold build 相当の artifacts.json を自前生成し、
  # 後続の Cloud Deploy ステップ（--build-artifacts）へそのまま渡す
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        set -euo pipefail
        TAG=$(git rev-parse --short=8 HEAD)
        IMAGE="$${SKAFFOLD_DEFAULT_REPO}/frontend"

        docker buildx create --name ci --driver docker-container --use
        docker buildx build \
          --cache-from "type=registry,ref=$${IMAGE}:buildcache" \
          --cache-to   "type=registry,ref=$${IMAGE}:buildcache,mode=max" \
          -t "$${IMAGE}:$${TAG}" \
          --push \
          --metadata-file metadata.json \
          .

        DIGEST=$(sed -n 's/.*"containerimage\.digest": *"\(sha256:[a-f0-9]*\)".*/\1/p' metadata.json | head -n1)
        if [ -z "$${DIGEST}" ]; then
          echo "failed to extract image digest from buildx metadata" >&2
          cat metadata.json >&2
          exit 1
        fi

        printf '{"builds":[{"imageName":"frontend","tag":"%s:%s@%s"}]}' \
          "$${IMAGE}" "$${TAG}" "$${DIGEST}" > artifacts.json
        cat artifacts.json

#  # Chap6ハンズオンのみ使用。Binary Authorizationの証明書を作成するステップ
