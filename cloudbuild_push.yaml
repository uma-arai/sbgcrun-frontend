options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - "DEPLOY_ENV=$_DEPLOY_ENV"
    - "ARTIFACT_REPO=asia-northeast1-docker.pkg.dev/$PROJECT_ID/sbgcrun-app"

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        set -euo pipefail
        TAG=$(git rev-parse --short=8 HEAD)
        IMAGE="$${ARTIFACT_REPO}/frontend"

        # 前回ビルドをキャッシュソースとして pull（初回・タグ未存在時は無視）
        docker pull "$${IMAGE}:latest" || true

        # 標準の docker build + push でビルド。
        # buildx を使わないため、タグが直接実イメージの digest を指す（Image Index を介さない）。
        # キャッシュは --cache-from + BUILDKIT_INLINE_CACHE で実現。
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$${IMAGE}:latest" \
          -t "$${IMAGE}:$${TAG}" \
          -t "$${IMAGE}:latest" \
          .

        # push — タグが直接実イメージ digest を指す
        docker push "$${IMAGE}:$${TAG}"
        docker push "$${IMAGE}:latest"

        # push 後に digest を取得
        DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$${IMAGE}:$${TAG}" | cut -d@ -f2)
        if [ -z "$${DIGEST}" ]; then
          echo "ERROR: failed to extract image digest" >&2
          exit 1
        fi

        # Cloud Deploy 用 artifacts.json を生成
        printf '{"builds":[{"imageName":"frontend","tag":"%s:%s@%s"}]}' \
          "$${IMAGE}" "$${TAG}" "$${DIGEST}" > artifacts.json
        cat artifacts.json

        # attestation ステップ用に digest を共有（jq 不要にする）
        echo "$${DIGEST}" > /workspace/image_digest

  # # Chap6ハンズオンのみ使用。Binary Authorization の証明書を作成するステップ
  # - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
  #   id: "create-attestation"
  #   waitFor:
  #     - build
  #   entrypoint: "bash"
  #   args:
  #     - "-c"
  #     - |-
  #       set -euo pipefail
  #       _IMAGE_DIGEST=$(cat /workspace/image_digest)
  #       echo "IMAGE_DIGEST: $${_IMAGE_DIGEST}"

  #       EXISTING=$(gcloud beta container binauthz attestations list \
  #         --project=$PROJECT_ID \
  #         --attestor=sbgcrun-attestor \
  #         --attestor-project=$PROJECT_ID \
  #         --artifact-url="$${ARTIFACT_REPO}/frontend@$${_IMAGE_DIGEST}" \
  #         --format='value(name)' 2>/dev/null || true)

  #       if [ -n "$${EXISTING}" ]; then
  #         echo "Attestation already exists, skipping."
  #       else
  #         gcloud beta container binauthz attestations sign-and-create \
  #           --project=$PROJECT_ID \
  #           --artifact-url="$${ARTIFACT_REPO}/frontend@$${_IMAGE_DIGEST}" \
  #           --attestor=sbgcrun-attestor \
  #           --attestor-project=$PROJECT_ID \
  #           --keyversion-project=$PROJECT_ID \
  #           --keyversion-location=$_REGION \
  #           --keyversion-keyring=sbgcrun-keyring \
  #           --keyversion-key=sbgcrun-attestor-key \
  #           --keyversion=1
  #       fi

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy"
    waitFor:
      - build
      # - create-attestation
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        set -euo pipefail
        gcloud deploy releases create $$DEPLOY_ENV-$(git rev-parse --short=8 HEAD)-$(echo $BUILD_ID | cut -c1-8) \
        --project=$PROJECT_ID \
        --region=$_REGION \
        --delivery-pipeline=${_PIPELINE_NAME} \
        --build-artifacts=artifacts.json \
        --skaffold-file=skaffold.yaml

substitutions:
  _PIPELINE_NAME: sbgcrun-frontend
  _REGION: asia-northeast1

timeout: 1200s
